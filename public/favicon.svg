<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;display=swap');
      .bg { fill: #0b0b0b; }
      .txt { fill: #ffffff; font-family: 'Syne', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -0.06em; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #ffffff; }
        .txt { fill: #0b0b0b; }
      }
    </style>
  </defs>
  <rect class="bg" width="64" height="64" rx="16"/>
  <text class="txt" x="32" y="44" text-anchor="middle">JG</text>
</svg>
